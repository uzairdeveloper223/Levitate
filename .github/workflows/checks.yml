name: Checks
# Local builds are the release path; hosted checks run only when requested.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-cryptography
      - run: /usr/bin/python3 -m unittest discover -s tests -v
        working-directory: linux
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: levitate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
